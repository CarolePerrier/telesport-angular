<div>
  <app-header
    [title]="titlePage"
    [indicators]="[
      { label: 'Number of entries', value: totalEntries },
      { label: 'Total Number of medals', value: totalMedals },
      { label: 'Total Number of athletes', value: totalAthletes }
    ]">
  </app-header>

  <div class="chart-container wrapper-container">
    <div class="container">
      <app-medal-chart
        type="line"
        [labels]="years"
        [values]="medals">
      </app-medal-chart>
      <h2>Date</h2>
    </div>
  </div>

  <div class="center">
    <a routerLink="/">Go back</a>
  </div>
</div>
