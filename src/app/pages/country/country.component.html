<div>
  <div>
    <div class="center">
      <div>{{ titlePage }}</div>
    </div>
    <div class="split">
      <app-stats-card [label]="'Number of entries'" [value]="totalEntries"></app-stats-card>
      <app-stats-card [label]="'Total Number of medals'" [value]="totalMedals"></app-stats-card>
      <app-stats-card [label]="'Total Number of athletes'" [value]="totalAthletes"></app-stats-card>
    </div>
  </div>
  <div class="chart-container wrapper-container">
    <div class="container">
      <app-medal-chart type="line" [labels]="years" [values]="medals"></app-medal-chart>
      <h2>Date</h2>
    </div>
  </div>
  <div class="center">
    <a routerLink="">Go back</a>
  </div>
</div>
