<h2>Olympic games app</h2>
<hr/>
<div>
  <div>
    <div class="center">
      <div>{{ titlePage }}</div>
    </div>
    <div class="split">
      <app-stats-card [label]="'Number of countries'" [value]="totalCountries"></app-stats-card>
      <app-stats-card [label]="'Number of JOs'" [value]="totalJOs"></app-stats-card>
    </div>
  </div>
  <app-medal-chart type="pie" [labels]="countries" [values]="medals" (countrySelected)="onCountrySelected($event)"></app-medal-chart>
</div>
