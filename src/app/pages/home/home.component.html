<h2>Olympic games app</h2>
<hr />

<div>
  <app-header
    [title]="titlePage"
    [indicators]="[
      { label: 'Number of countries', value: totalCountries },
      { label: 'Number of JOs', value: totalJOs }
    ]">
  </app-header>

  <app-medal-chart
    type="pie"
    [labels]="countries"
    [values]="medals"
    (countrySelected)="onCountrySelected($event)">
  </app-medal-chart>
</div>
